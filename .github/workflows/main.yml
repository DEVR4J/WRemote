name: Build and release TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o tv-app.zip -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Use the fixed signing key (needed so updates install over older versions)
        run: |
          mkdir -p ~/.android
          cp src/ci/debug.keystore ~/.android/debug.keystore
      - name: Put repo name and build number into the app
        run: sed -i "s|OWNER/REPO|${{ github.repository }}|; s|const val BUILD = 0|const val BUILD = ${{ github.run_number }}|" src/app/src/main/java/com/example/tvagent/Updater.kt
      - name: Build TV APK
        run: |
          set -o pipefail
          gradle -p src assembleRelease --no-daemon --console=plain -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:" build.log | head -40 || true
      - name: Name the APK
        run: cp src/app/build/outputs/apk/release/app-release.apk ATC-TV.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ATC TV v1.0.${{ github.run_number }}
          files: ATC-TV.apk
          make_latest: true
