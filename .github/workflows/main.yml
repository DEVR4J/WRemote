name: Build TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      server_url:
        description: "wss:// address of your deployed server (or set repo variable SERVER_URL)"
        required: false

permissions:
  contents: read

env:
  SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL }}

jobs:
  tv-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o tv-app.zip -d src
      - name: Check server URL
        run: |
          if [[ "$SERVER_URL" != wss://* ]]; then
            echo "::warning::No SERVER_URL set, building with a placeholder. Set repo variable SERVER_URL (wss://...) and re-run before using the app."
            echo "SERVER_URL=wss://YOUR-APP.onrender.com" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Set server URL
        run: sed -i "s|wss://YOUR-APP.onrender.com|$SERVER_URL|" src/app/src/main/java/com/example/tvagent/Agent.kt
      - name: Build TV APK
        run: gradle -p src assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tv-agent-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
